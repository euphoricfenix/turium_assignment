[project]
name = "knowledge-inbox-backend"
version = "0.1.0"
description = "AI Knowledge Inbox: ingest notes and URLs, ask questions over them with cited sources."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "numpy>=2.1",
    "crewai>=1.15",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "ddgs>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
