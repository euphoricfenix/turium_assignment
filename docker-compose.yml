services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Volume path and the origin the browser will use, overriding .env.
      DATABASE_PATH: /data/knowledge_inbox.db
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - inbox-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  inbox-data:
